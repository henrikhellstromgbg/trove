.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

}

}

.form-range {

  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

  background: linear-gradient(

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Specialverktyg&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Projektunik analys ovanpå Trove&lt;/td&gt;&lt;td&gt;Valfritt&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ta-pill&quot;&gt;Utanför kärnan&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

  &lt;section class=&quot;ta-view&quot; id=&quot;ta-processing&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-processing&quot; data-panel=&quot;processing&quot; hidden&gt;
    &lt;p class=&quot;ta-section-label&quot;&gt;Samma livscykel används oavsett om materialet droppas, hämtas från mail eller kommer från en webbtjänst&lt;/p&gt;
    &lt;div class=&quot;ta-lifecycle&quot; aria-label=&quot;Bearbetningens livscykel&quot;&gt;
      &lt;div class=&quot;ta-life-stage&quot;&gt;&lt;strong&gt;Upptäckt&lt;/strong&gt;&lt;span&gt;Källan ser något nytt&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;ta-life-stage&quot;&gt;&lt;strong&gt;Original&lt;/strong&gt;&lt;span&gt;Innehåll och källmetadata sparas&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;ta-life-stage&quot;&gt;&lt;strong&gt;Kontroll&lt;/strong&gt;&lt;span&gt;Dublett, filtyp och säkerhet&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;ta-life-stage&quot;&gt;&lt;strong&gt;Urval&lt;/strong&gt;&lt;span&gt;Regler och relevansbedömning&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;ta-life-stage&quot;&gt;&lt;strong&gt;Bearbetning&lt;/strong&gt;&lt;span&gt;Text, fakta, metadata och delar&lt;/span&gt;&lt;/div&gt;

    &lt;/div&gt;

    &lt;div class=&quot;ta-branch&quot; aria-label=&quot;Möjliga resultat efter kontroll&quot;&gt;
      &lt;div&gt;&lt;strong&gt;Automatiskt godkänd&lt;/strong&gt;&lt;span&gt;Hög säkerhet och tydlig regelträff. Fortsätter direkt.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Behöver granskas&lt;/strong&gt;&lt;span&gt;Osäker relevans, känsligt innehåll eller låg kvalitet.&lt;/span&gt;&lt;/div&gt;
      &lt;div&gt;&lt;strong&gt;Misslyckad&lt;/strong&gt;&lt;span&gt;Fel sparas med orsak och kan köras om utan ny import.&lt;/span&gt;&lt;/div&gt;

  &lt;/section&gt;

  &lt;section class=&quot;ta-view&quot; id=&quot;ta-model&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-model&quot; data-panel=&quot;model&quot; hidden&gt;
    &lt;p class=&quot;ta-section-label&quot;&gt;Samlad ägar- och datamodell. Status visar vad som finns i koden idag.&lt;/p&gt;
    &lt;div class=&quot;ta-model&quot;&gt;
      &lt;div class=&quot;ta-model-stack&quot;&gt;
        &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Konto&lt;/strong&gt;&lt;span&gt;Identitet och inloggning hanteras av Clerk.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;partial&quot;&gt;Delvis&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Anslutet konto&lt;/strong&gt;&lt;span&gt;Gmail, Slack och andra behörigheter. Kopplas en gång.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot;&gt;Planerad&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Ingest-nyckel&lt;/strong&gt;&lt;span&gt;Ger Mac-appen rätt att skicka till ett bestämt projekt.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;now&quot;&gt;Finns&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ta-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;ta-model-stack&quot;&gt;
        &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;red&quot;&gt;&lt;strong&gt;Projekt&lt;/strong&gt;&lt;span&gt;Den hårda gränsen. Allt nedan ägs av ett projekt.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;partial&quot;&gt;Finns, behöver låsas&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;ta-owns&quot;&gt;
          &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Datakälla&lt;/strong&gt;&lt;span&gt;Vad som bevakas, var och hur ofta.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;now&quot;&gt;Finns&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;amber&quot;&gt;&lt;strong&gt;Källregel&lt;/strong&gt;&lt;span&gt;Urval, osäkerhet och granskningsregler.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot;&gt;Planerad&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Källkörning&lt;/strong&gt;&lt;span&gt;Status, fel, räknare, tider och sparad position.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;partial&quot;&gt;Delvis i datakällan&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Originalpost&lt;/strong&gt;&lt;span&gt;Oföränderlig kopia av det som hämtades.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot;&gt;Planerad&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;green&quot;&gt;&lt;strong&gt;Kunskapspost&lt;/strong&gt;&lt;span&gt;Posten som visas i biblioteket.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;now&quot;&gt;Finns som Item&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;green&quot;&gt;&lt;strong&gt;Bearbetade resultat&lt;/strong&gt;&lt;span&gt;Textdelar, metadata och sökindex.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;partial&quot;&gt;Delvis&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;amber&quot;&gt;&lt;strong&gt;Granskningsbeslut&lt;/strong&gt;&lt;span&gt;Godkänd, avvisad eller korrigerad.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot;&gt;Planerad&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;red&quot;&gt;&lt;strong&gt;Papperskorg och raderingsmarkör&lt;/strong&gt;&lt;span&gt;Återställning och skydd mot oönskad återimport.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot;&gt;Planerad&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;green&quot;&gt;&lt;strong&gt;Pipeline&lt;/strong&gt;&lt;span&gt;Återkommande arbete på projektets bibliotek.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;now&quot;&gt;Finns&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot; data-tone=&quot;green&quot;&gt;&lt;strong&gt;Pipeline-körning&lt;/strong&gt;&lt;span&gt;Status och sparat rapportresultat.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;now&quot;&gt;Finns&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Konversation och meddelande&lt;/strong&gt;&lt;span&gt;Frågehistorik och källhänvisningar.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;partial&quot;&gt;Datamodell finns&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;ta-model-node&quot;&gt;&lt;strong&gt;Ämne&lt;/strong&gt;&lt;span&gt;Automatiskt grupperad kunskap i projektet.&lt;/span&gt;&lt;small class=&quot;ta-model-status&quot; data-state=&quot;now&quot;&gt;Finns&lt;/small&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ta-model-foot&quot; aria-label=&quot;Viktiga unika nycklar&quot;&gt;
      &lt;span class=&quot;ta-pill&quot;&gt;projekt + källa + extern identitet&lt;/span&gt;
      &lt;span class=&quot;ta-pill&quot;&gt;projekt är enda huvudgränsen&lt;/span&gt;
      &lt;span class=&quot;ta-pill&quot;&gt;källor importerar&lt;/span&gt;
      &lt;span class=&quot;ta-pill&quot;&gt;pipelines skapar resultat&lt;/span&gt;
      &lt;span class=&quot;ta-pill&quot;&gt;planerat: original skrivs aldrig över&lt;/span&gt;

  &lt;section class=&quot;ta-view&quot; id=&quot;ta-roadmap&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-roadmap&quot; data-panel=&quot;roadmap&quot; hidden&gt;
    &lt;div class=&quot;ta-roadmap&quot;&gt;
      &lt;div class=&quot;ta-roadmap-col&quot;&gt;
        &lt;strong&gt;1. Blockerande grund&lt;/strong&gt;
        &lt;ul class=&quot;ta-roadmap-list&quot;&gt;
          &lt;li&gt;Riktiga databasmigreringar&lt;span&gt;Schema, migrering och 768-dimensionella embeddings måste stämma.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Lås projektgränsen&lt;span&gt;Alla API:er, relationer och frågor ska kräva och kontrollera projekt.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;En enda importväg&lt;span&gt;Webb, Mac-app och molnkällor ska använda /api/ingest.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Grundtester&lt;span&gt;Bevisa projektisolering, import och återkommande körningar.&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ta-roadmap-col&quot;&gt;
        &lt;strong&gt;2. Stabilisera det som finns&lt;/strong&gt;
        &lt;ul class=&quot;ta-roadmap-list&quot;&gt;
          &lt;li&gt;Capture, Library och Ask&lt;span&gt;Behåll befintliga flöden och gör projektkravet tydligt.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;RSS, webb och Slack&lt;span&gt;Behåll enkla källor men gör anslutning och fel tydliga.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Pipelines, Digest och startmallar&lt;span&gt;Behåll motorn och erbjud morgonbrief samt fredagssammanställning som separata val.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Mac-appen&lt;span&gt;Skicka riktiga filer med ingest-nyckel och valt projekt.&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ta-roadmap-col&quot;&gt;
        &lt;strong&gt;3. Nästa produktflöden&lt;/strong&gt;
        &lt;ul class=&quot;ta-roadmap-list&quot;&gt;
          &lt;li&gt;Anslutna konton&lt;span&gt;Gmail och Slack kopplas globalt och används av projektägda källor.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Fler pipeline-mallar&lt;span&gt;Användaren kan välja flera rapporter och ändra schema, innehåll och leverans separat.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Källregler, körningar och original&lt;span&gt;Ger förhandsgranskning, historik, felsökning och omkörning.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Mail och bevakad mapp&lt;span&gt;Det tydligaste generella användarvärdet från Intel.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Granskningskö&lt;span&gt;Osäkert material avgörs innan det blir färdig kunskap.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Papperskorg och återimportsspärr&lt;span&gt;Radering blir återställbar och förutsägbar.&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ta-roadmap-col&quot;&gt;
        &lt;strong&gt;4. Senare&lt;/strong&gt;
        &lt;ul class=&quot;ta-roadmap-list&quot;&gt;
          &lt;li&gt;Vanlig YouTube-transkribering&lt;span&gt;En generell källa, inte Tactical Athletes specialanalys.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Färdiga källmallar&lt;span&gt;Nyhetsbrev, kundmail, forskning och projektdokument.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Delade projekt och roller&lt;span&gt;När ägande och rättigheter är ordentligt definierade.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Vertikala paket&lt;span&gt;Specialregler ovanpå kärnan, inte inuti den.&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;trove-flow-architecture&quot;);
      if (!root) return;

      const details = {
        capture: [&quot;Drag and drop&quot;, &quot;Den befintliga fångstytan är den manuella datakällan. Användaren ser alltid vilket projekt filen hamnar i. Filen sparas som original och går sedan genom samma behandling som automatiska källor.&quot;],
        mail: [&quot;Mailmapp&quot;, &quot;Användaren ansluter sitt mailkonto en gång och väljer sedan mapp, urval och regler inne i projektet. Apple Mail kräver Mac-appen, medan Gmail kan köras i molnet.&quot;],
        folder: [&quot;Bevakad mapp&quot;, &quot;Mac-appen ser nya lokala filer och skickar dem till projektets importadress. Den lokala sökvägen stannar på datorn; Trove tar emot själva filen och källinformationen.&quot;],
        cloud: [&quot;Webbkällor&quot;, &quot;RSS, webbsidor och Slack körs i molnet. Varje anslutning översätter sin källa till samma format: projekt, källa, extern identitet, original och tidpunkt.&quot;],
        ingest: [&quot;Ta emot och spara original&quot;, &quot;En enda importväg tar emot allt material. Originalet sparas separat från den bearbetade kunskapsposten så att ändringar, omkörningar och beviskedjan kan följas.&quot;],
        select: [&quot;Välj och kontrollera&quot;, &quot;Billiga och tydliga kontroller körs först: dublett, filtyp, storlek, avsändare och fasta regler. AI används därefter för relevans och innehåll som inte kan avgöras med enkla regler.&quot;],
        process: [&quot;Bearbeta&quot;, &quot;Text utvinns och normaliseras. Trove skapar titel, sammanfattning, ämnen, strukturerade fakta, sökbara textdelar och de index som behövs för frågor och rapporter.&quot;],
        review: [&quot;Granska vid behov&quot;, &quot;Osäkra eller känsliga träffar hamnar i projektets granskningskö. Där syns originalet, varför Trove är osäker och vad som händer vid godkännande eller avvisning.&quot;],
        library: [&quot;Bibliotek&quot;, &quot;Den färdiga kunskapsposten visar original, källa, bearbetad text, status och historik. Flytt, omkörning och rättning sker här utan att beviset försvinner.&quot;],
        ask: [&quot;Fråga Trove&quot;, &quot;Frågor söker endast inom det aktiva projektet. Svar visar vilka kunskapsposter och vilka textstycken som stödjer varje viktig uppgift.&quot;],
        pipelines: [&quot;Pipelines och rapporter&quot;, &quot;En pipeline läser kunskap som redan finns i projektets bibliotek och skapar ett återkommande resultat, till exempel en veckosammanfattning. Datakällor importerar material; pipelines gör något med materialet efteråt.&quot;]
      };

      const tabs = Array.from(root.querySelectorAll(&quot;.ta-tab&quot;));
      const panels = Array.from(root.querySelectorAll(&quot;.ta-view&quot;));
      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&quot;click&quot;, () =&gt; {
          const view = tab.dataset.view;
          tabs.forEach((candidate) =&gt; candidate.setAttribute(&quot;aria-selected&quot;, String(candidate === tab)));
          panels.forEach((panel) =&gt; { panel.hidden = panel.dataset.panel !== view; });
        });
      });

      const title = root.querySelector(&quot;#ta-detail-title&quot;);
      const text = root.querySelector(&quot;#ta-detail-text&quot;);
      const nodes = Array.from(root.querySelectorAll(&quot;.ta-node[data-node]&quot;));
      nodes.forEach((node) =&gt; {
        node.addEventListener(&quot;click&quot;, () =&gt; {
          const detail = details[node.dataset.node];
          if (!detail || !title || !text) return;
          nodes.forEach((candidate) =&gt; candidate.classList.toggle(&quot;is-active&quot;, candidate === node));
          title.textContent = detail[0];
          text.textContent = detail[1];
        });
      });

      const wireDetails = {
        project: [&quot;Skapa projekt&quot;, &quot;Användaren anger ett synligt namn och väljer projekttyp. Den valfria beskrivningen hjälper Trove föreslå relevanta datakällor och startregler, men styr aldrig projektets säkerhetsgräns.&quot;],
        empty: [&quot;Tomt projekt&quot;, &quot;Startpunkten visar två likvärdiga vägar: lägg in material manuellt eller koppla en återkommande datakälla. Projektet är redan valt och synligt.&quot;],
        capture: [&quot;Drag and drop&quot;, &quot;Den manuella importen visar målprojektet före uppladdning. Filen sparas som original, får en importstatus och går sedan genom samma behandling som automatiska datakällor.&quot;],
        choose: [&quot;Välj datakälla&quot;, &quot;Källväljaren beskriver användarens mål, inte tekniken bakom. Mail och bevakad mapp markeras som de viktigaste nästa kärnflödena.&quot;],
        mail: [&quot;Mail-setup&quot;, &quot;Guiden binder ett globalt anslutet konto till en projektägd mailmapp och en regel. Den fria instruktionen sparas tillsammans med fasta val för mapp, schema och osäkerhet.&quot;],
        preview: [&quot;Provkörning&quot;, &quot;Innan aktivering testar Trove regeln på ett begränsat urval och visar vad som skulle sparas, granskas och hoppas över. Detta är kontrollen mot dåliga AI-regler.&quot;],
        sources: [&quot;Källöversikt&quot;, &quot;Projektet visar varje källas hälsa, körplats, senaste synk och antal poster. Lokala källor visar även om Mac-appen är tillgänglig.&quot;],
        pipelines: [&quot;Pipelines&quot;, &quot;Listan visar projektets återkommande uppdrag, schema, leverans och om de är aktiva eller pausade. Pipelines läser biblioteket men importerar aldrig nytt material.&quot;],
        pipelinetemplates: [&quot;Pipeline-mallar&quot;, &quot;Användaren börjar med ett begripligt resultat i stället för en tom instruktion. Flera mallar kan aktiveras i samma projekt, till exempel en morgonbrief varje vardag och en veckosammanställning på fredag.&quot;],
        newpipeline: [&quot;Skapa pipeline&quot;, &quot;Användaren beskriver önskat återkommande resultat med vanligt språk. Trove visar alltid vilket material som läses, när körningen sker och var resultatet sparas eller skickas.&quot;],
        pipelinedetail: [&quot;Pipeline-detalj&quot;, &quot;Detaljsidan visar den aktiva instruktionen, schema, leverans, status och full körhistorik. En misslyckad leverans får inte radera det redan skapade rapportresultatet.&quot;],
        report: [&quot;Rapportresultat&quot;, &quot;När e-post är vald skickas rapporten till mottagaren på schemalagd tid. Samma resultat sparas i Trove som historik med källhänvisningar och kan öppnas eller skickas igen om leveransen misslyckades.&quot;],
        review: [&quot;Granskningskö&quot;, &quot;Osäkert material blockeras före biblioteket. Användarens beslut sparas och kan senare användas för att förbättra projektets regel.&quot;],
        library: [&quot;Bibliotek&quot;, &quot;Godkänt material från manuella och automatiska källor blandas i samma bibliotek men behåller tydlig källa, datum, status och original.&quot;],
        item: [&quot;Postdetalj och radera&quot;, &quot;Alla åtgärder för en post finns på samma plats. Radera flyttar först posten till projektets papperskorg och påverkar aldrig originalfilen i en bevakad lokal mapp.&quot;],
        trash: [&quot;Projektets papperskorg&quot;, &quot;Raderade poster kan återställas under en bestämd tid. Permanent radering tar bort Troves originalkopia, bearbetad text, metadata, textdelar och sökindex.&quot;],
        deletesource: [&quot;Ta bort datakälla&quot;, &quot;Standardvalet stoppar framtida import men behåller befintliga poster. Användaren kan i stället flytta allt material från källan till papperskorgen med ett uttryckligt val.&quot;],
        ask: [&quot;Ask&quot;, &quot;Frågan körs endast mot det aktiva projektet. Svaret skiljer mellan vad källorna faktiskt stödjer och vad som är osäkert, och varje viktig uppgift länkar till rätt original och textstycke.&quot;],
        usermenu: [&quot;Användarmeny och logga ut&quot;, &quot;Kontomenyn ligger globalt längst ned i sidomenyn. Den ändras inte när användaren byter projekt och innehåller profil, globala inställningar och en tydlig logga ut-åtgärd.&quot;],
        profile: [&quot;Profil&quot;, &quot;Profilen tillhör användarkontot och innehåller namn, primär e-post, språk och tidszon. Den påverkar alla projekt men innehåller inget projektmaterial.&quot;],
        connections: [&quot;Globala anslutningar&quot;, &quot;Gmail, Slack och den lokala Mac-appen ansluts en gång till kontot. Inne i varje projekt väljer användaren därefter exakt mapp eller kanal och skapar projektets egna importregler.&quot;],
        security: [&quot;Säkerhet&quot;, &quot;Första versionen visar bara inloggning och aktiva enheter. Privata filer, projektgränser och säkra nycklar är tekniska grundregler och presenteras inte som valbara inställningar.&quot;],
        projectsettings: [&quot;Projektinställningar&quot;, &quot;Namn, synlighet, granskningspolicy, medlemmar, export och projektets livscykel hör till projektet. Kontots Gmail-behörighet visas inte här; här finns bara projektets valda mailkälla.&quot;],
        health: [&quot;Källdetalj&quot;, &quot;Varje körning får status, räknare och felorsak. Användaren kan köra om ett fel utan att skapa dubletter eller importera allt på nytt.&quot;]
      };
      const wireButtons = Array.from(root.querySelectorAll(&quot;.ta-wire-button&quot;));
      const wirePanels = Array.from(root.querySelectorAll(&quot;.ta-wire-screen&quot;));
      const wireTitle = root.querySelector(&quot;#ta-wire-title&quot;);
      const wireText = root.querySelector(&quot;#ta-wire-text&quot;);
      wireButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const view = button.dataset.wire;
          wireButtons.forEach((candidate) =&gt; candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button)));

            wireText.textContent = detail[1];

      const wireStage = root.querySelector(&quot;#ta-wire-stage&quot;);
      const deviceButtons = Array.from(root.querySelectorAll(&quot;.ta-device-button&quot;));

        const side = screen.querySelector(&quot;.ta-wf-side&quot;);
        if (!side || !side.querySelector(&quot;.ta-wf-project&quot;) || side.querySelector(&quot;.ta-wf-side-account&quot;)) return;

        settings.textContent = &quot;Settings&quot;;
        const user = document.createElement(&quot;span&quot;);

        side.append(account);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
